# tests/asterinas.toml plus `sb_zero_size_retag_keeps_tag`: `DynCpuLocalChunk`
# tracks its free items with `bitvec`, which Stacked Borrows rejects otherwise.
page_table = true
total_mem_size = 0x800_0000
sb_zero_size_retag_keeps_tag = true

[irq]
enabled = true
tick_interval_basic_blocks = 0
inject_at_basic_blocks = []
random_injection_rate = 0.0
random_seed = 0
handler_budget_basic_blocks = 10000
trace = false
